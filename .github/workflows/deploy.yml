name: Auto Deploy Quasar Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Build Quasar SPA
      run: npx quasar build -m spa

    - name: Create zip of build
      run: |
        cd dist
        zip -r spa.zip spa/*

    - name: Deploy via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 85.198.67.95
        username: root
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        source: dist/spa.zip
        target: /tmp
        strip_components: 1

    - name: Extract build on server
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: 85.198.67.95
        username: root
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          rm -rf /var/www/crm/dist/spa/*
          unzip -o /tmp/spa.zip -d /var/www/crm/dist/
          rm -f /tmp/spa.zip
