name: Auto Deploy Quasar Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Build Quasar SPA
      run: npx quasar build -m spa

    - name: Check dist folder
      run: ls -lhR dist

    - name: Create zip of build
      run: |
        cd dist
        zip -r spa.zip spa/*

    - name: Copy build to server via SCP
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H 85.198.67.95 >> ~/.ssh/known_hosts
        scp -i ~/.ssh/deploy_key dist/spa.zip root@85.198.67.95:/tmp/

    - name: Extract build on server
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      run: |
        ssh -i ~/.ssh/deploy_key root@85.198.67.95 "
          rm -rf /var/www/crm/dist/spa/* &&
          unzip -o /tmp/spa.zip -d /var/www/crm/dist/ &&
          rm /tmp/spa.zip &&
          echo 'Deploy complete'
        "
