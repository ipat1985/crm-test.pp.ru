name: Auto Deploy Quasar Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Build Quasar SPA
      run: npx quasar build -m spa

    - name: Create zip of build
      run: |
        cd dist
        zip -r spa.zip spa/*

    - name: Deploy to server
      env:
        SSH_PASS: ${{ secrets.DEPLOY_SSH_PASS }}
      run: |
        apt-get update -qq && apt-get install -y -qq sshpass
        sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=accept-new dist/spa.zip root@85.198.67.95:/tmp/
        sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=accept-new root@85.198.67.95 '
          rm -rf /var/www/crm/dist/spa/* &&
          unzip -o /tmp/spa.zip -d /var/www/crm/dist/ &&
          rm -f /tmp/spa.zip
        '
