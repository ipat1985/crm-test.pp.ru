name: Auto Deploy Quasar Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Build Quasar SPA
      run: npx quasar build -m spa

    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

    - name: Add host to known_hosts
      run: ssh-keyscan -H 85.198.67.95 >> ~/.ssh/known_hosts

    - name: Create zip and copy to server
      run: |
        cd dist
        zip -r spa.zip spa/*
        scp spa.zip root@85.198.67.95:/tmp/

    - name: Extract build on server
      run: |
        ssh root@85.198.67.95 '
          rm -rf /var/www/crm/dist/spa/* &&
          unzip -o /tmp/spa.zip -d /var/www/crm/dist/ &&
          rm -f /tmp/spa.zip
        '
